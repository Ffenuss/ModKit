name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modkit-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" "ndk;28.2.13676358"
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          test -x "${ANDROID_HOME}/ndk/28.2.13676358/ndk-build"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests, lint, assemble
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/modkit-runtime-probe.dex > ModKit-runtime-probe.dex
          test -s ModKit-runtime-probe.dex
          test "$(od -An -tx1 -N4 ModKit-runtime-probe.dex | tr -d ' \n')" = "6465780a"
          grep -aFq "RuntimeEvidenceProvider" ModKit-runtime-probe.dex
          grep -aFq "RuntimeNativeBridge" ModKit-runtime-probe.dex
          grep -aFq "RuntimeNativeTraceBuffer" ModKit-runtime-probe.dex
          grep -aFq "RuntimeModMenu" ModKit-runtime-probe.dex
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            NATIVE="ModKit-runtime-probe-${ABI}.so"
            unzip -p "$APK" "assets/modkit-runtime-probe-native/${ABI}/libmodkit_runtime_probe.so" > "$NATIVE"
            test -s "$NATIVE"
            test "$(od -An -tx1 -N4 "$NATIVE" | tr -d ' \n')" = "7f454c46"
            grep -aFq "RuntimeNativeBridge_nativeResolveLoadedSymbol" "$NATIVE"
            grep -aFq "RuntimeNativeBridge_nativeStartPassiveDlsymTrace" "$NATIVE"
            grep -aFq "RuntimeNativeBridge_nativeStopPassiveDlsymTrace" "$NATIVE"
            grep -aFq "RuntimeNativeBridge_nativePatchCode" "$NATIVE"
          done
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature-verification.txt
          cp "$APK" ModKit-v0.0.29-debug.apk
          sha256sum ModKit-v0.0.29-debug.apk > ModKit-v0.0.29-debug.apk.sha256

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-jvm
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            apk-signature-verification.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-v0.0.29-debug
          path: |
            ModKit-v0.0.29-debug.apk
            ModKit-v0.0.29-debug.apk.sha256
          if-no-files-found: error

  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            fixture: single
          - api: 35
            fixture: splits
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install compile SDK and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build owned fixture and instrumentation
        run: gradle --no-daemon :testgame:assembleDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run actual Android workflow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            bash tools/install_device_fixture.sh ${{ matrix.fixture }}
            adb logcat -c
            set +e; gradle --no-daemon :app:connectedDebugAndroidTest; RESULT=$?; adb logcat -d > device-logcat.txt; adb pull /data/local/tmp/modkit-device-validation device-validation || true; exit $RESULT
      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-device-api${{ matrix.api }}-${{ matrix.fixture }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            device-validation/
            device-logcat.txt
